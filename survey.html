<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Questionário</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="container">
    <header>
      <p class="eyebrow">DINÂMICA DO SEMINÁRIO</p>
      <h1>Questionário</h1>
      <p>Considere o texto que você acabou de ler. Responda de acordo com sua percepção.</p>
    </header>

    <form id="survey" class="panel">
      <div id="questions"></div>
      <button class="button" type="submit">Enviar respostas</button>
      <p id="status" role="status" class="muted"></p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="content.js"></script>
  <script src="survey.js"></script>
</body>

</html>
